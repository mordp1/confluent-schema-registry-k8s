# =============================================================================
# Default values for cp-schema-registry
# Official image: confluentinc/cp-schema-registry
# =============================================================================

replicaCount: 1

# ---------------------------------------------------------------------------
# Image — pin to a specific tag; NEVER use 'latest'
# CP 7.7.1 is the current stable Community Edition release.
# ---------------------------------------------------------------------------
image:
  repository: confluentinc/cp-schema-registry
  tag: "8.2.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ---------------------------------------------------------------------------
# JVM heap settings — passed as SCHEMA_REGISTRY_HEAP_OPTS
# Reduce for local/kind clusters; increase for production.
# ---------------------------------------------------------------------------
heapOptions: "-Xms512M -Xmx512M"

# ---------------------------------------------------------------------------
# Kafka connectivity
# Protocol prefix is required: PLAINTEXT://, SASL_PLAINTEXT://, etc.
# Example: "PLAINTEXT://my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
# ---------------------------------------------------------------------------
kafka:
  bootstrapServers: ""

# ---------------------------------------------------------------------------
# Schema Registry port
# ---------------------------------------------------------------------------
servicePort: 8081

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8081
  annotations: {}

# ---------------------------------------------------------------------------
# Schema Registry configuration overrides
# Each key becomes SCHEMA_REGISTRY_<KEY_UPPERCASED> env var.
# Dots in keys are replaced with underscores.
# Example:
#   configurationOverrides:
#     "authentication.method": "BASIC"
#     "authentication.realm": "SchemaRegistry-Props"
# ---------------------------------------------------------------------------
configurationOverrides: {}

# ---------------------------------------------------------------------------
# Extra JVM options → set as SCHEMA_REGISTRY_OPTS env var.
# Use this to pass -Djava.security.auth.login.config and other JVM flags.
# Example: "-Djava.security.auth.login.config=/etc/schema-registry/auth/jaas.conf"
# ---------------------------------------------------------------------------
schemaRegistryOpts: ""

# ---------------------------------------------------------------------------
# Extra environment variables — Kubernetes env var list format.
# Supports both plain values and valueFrom (secretKeyRef, configMapKeyRef).
# Example:
#   customEnv:
#     - name: JAVA_TOOL_OPTIONS
#       value: "-Djava.security.auth.login.config=/etc/schema-registry/auth/jaas.conf"
#     - name: MY_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: my-secret
#           key: password
# ---------------------------------------------------------------------------
customEnv: []

# ---------------------------------------------------------------------------
# Extra volumes and volume mounts
# Use these to mount Kubernetes Secrets, ConfigMaps, or emptyDirs.
# Example (mounting a Secret for JAAS auth):
#   volumes:
#     - name: auth-config
#       secret:
#         secretName: schema-registry-auth
#         defaultMode: 0400
#   volumeMounts:
#     - name: auth-config
#       mountPath: /etc/schema-registry/auth
#       readOnly: true
# ---------------------------------------------------------------------------
volumes: []
volumeMounts: []

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources: {}

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Pod-level settings
# ---------------------------------------------------------------------------
podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  runAsUser: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Liveness probe
# type: "tcp"  → tcpSocket probe on servicePort (auth-agnostic — recommended
#                when HTTP Basic auth is enabled, as /subjects returns 401)
# type: "http" → httpGet on /subjects (only use when auth is disabled)
# type: "exec" → uses customLivenessProbe (set probe.enabled: false and
#                populate customLivenessProbe instead)
# ---------------------------------------------------------------------------
livenessProbe:
  enabled: true
  type: tcp     # tcp | http — see note above
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  type: tcp
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Set customLivenessProbe / customReadinessProbe for full control.
# When set, they override the probe built from livenessProbe/readinessProbe above.
customLivenessProbe: {}
customReadinessProbe: {}

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# When enabled, replicaCount is ignored — HPA controls the replica count.
# Requires metrics-server installed in the cluster.
# minReplicas >= 2 is recommended so the SR always has a standby leader candidate.
# ---------------------------------------------------------------------------
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  metrics:
    cpu:
      enabled: true
      targetAverageUtilization: 70
    memory:
      enabled: false
      targetAverageUtilization: 80
  # behavior controls how fast the HPA scales up and down.
  # scaleDown stabilization avoids flapping after a traffic spike.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60             # remove at most 1 pod per minute
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60             # add at most 2 pods per minute

# ---------------------------------------------------------------------------
# PodDisruptionBudget
# Recommended for production (replicaCount >= 2).
# ---------------------------------------------------------------------------
pdb:
  enabled: false
  minAvailable: ""
  maxUnavailable: 1

# ---------------------------------------------------------------------------
# JMX
# ---------------------------------------------------------------------------
jmx:
  port: 5555

# ---------------------------------------------------------------------------
# Prometheus JMX exporter sidecar
# ---------------------------------------------------------------------------
prometheus:
  jmx:
    enabled: false
    image: solsson/kafka-prometheus-jmx-exporter
    imageTag: "latest"
    imagePullPolicy: IfNotPresent
    port: 5556
    resources: {}

# ---------------------------------------------------------------------------
# Ingress
# Disabled by default. Enable for ALB (or nginx) Ingress Controller access.
# When enabled alongside service.type: ClusterIP, the Ingress controller
# handles external exposure and TLS — no LoadBalancer Service is created.
#
# Example (AWS ALB):
#   ingress:
#     enabled: true
#     ingressClassName: alb
#     annotations:
#       alb.ingress.kubernetes.io/scheme: internal
#       alb.ingress.kubernetes.io/target-type: ip
#       alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:..."
#       external-dns.alpha.kubernetes.io/hostname: "schema-registry.internal.example.com"
#     hosts:
#       - host: schema-registry.internal.example.com
#         paths:
#           - path: /
#             pathType: Prefix
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  #  - host: schema-registry.internal.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: schema-registry-tls
  #    hosts:
  #      - schema-registry.internal.example.com

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []

# terminationGracePeriodSeconds — time given to the pod to finish in-flight
# requests before SIGKILL. Increase for production (SR may be handling writes).
terminationGracePeriodSeconds: 30

# affinity — full Kubernetes affinity spec.
# Supports nodeAffinity, podAffinity, and podAntiAffinity.
#
# Production example — spread across AZs (preferred) and avoid spot nodes (required):
#   affinity:
#     nodeAffinity:
#       requiredDuringSchedulingIgnoredDuringExecution:
#         nodeSelectorTerms:
#           - matchExpressions:
#               - key: node.kubernetes.io/lifecycle
#                 operator: NotIn
#                 values: [spot]
#     podAntiAffinity:
#       preferredDuringSchedulingIgnoredDuringExecution:
#         - weight: 100
#           podAffinityTerm:
#             labelSelector:
#               matchLabels:
#                 app.kubernetes.io/name: cp-schema-registry
#             topologyKey: topology.kubernetes.io/zone
affinity: {}

# topologySpreadConstraints — fine-grained pod distribution across zones/nodes.
# More deterministic than podAntiAffinity when node counts vary per zone.
#
# Production example — even spread across zones, hard constraint:
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: topology.kubernetes.io/zone
#       whenUnsatisfiable: DoNotSchedule
#       labelSelector:
#         matchLabels:
#           app.kubernetes.io/name: cp-schema-registry
#     - maxSkew: 1
#       topologyKey: kubernetes.io/hostname
#       whenUnsatisfiable: ScheduleAnyway
#       labelSelector:
#         matchLabels:
#           app.kubernetes.io/name: cp-schema-registry
topologySpreadConstraints: []
