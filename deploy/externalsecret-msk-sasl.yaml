# =============================================================================
# External Secrets Operator — sync MSK SCRAM credentials from AWS Secrets Manager
#
# Prerequisites:
#   - External Secrets Operator installed (external-secrets.io)
#   - A ClusterSecretStore configured with AWS credentials that have
#     secretsmanager:GetSecretValue on the AmazonMSK_* path
#   - The MSK user secret created in Secrets Manager:
#       Name: AmazonMSK_schema-registry
#       Value: {"username":"schema-registry","password":"<strong-password>"}
#
# What this does:
#   1. ESO reads username + password from Secrets Manager
#   2. Assembles them into the JAAS config string using a template
#   3. Creates and keeps-in-sync the Kubernetes Secret "schema-registry-msk-sasl"
#
# This produces the same Secret as secret-msk-sasl.yaml but credentials are
# never stored in Git — they live only in AWS Secrets Manager.
#
# Install ESO:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm upgrade --install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace
#
# Apply:
#   kubectl apply -f deploy/externalsecret-msk-sasl.yaml -n schema-registry
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: schema-registry-msk-sasl
  namespace: schema-registry   # change to match your deployment namespace
  labels:
    app.kubernetes.io/name: cp-schema-registry
    app.kubernetes.io/component: msk-auth
spec:
  refreshInterval: 1h

  secretStoreRef:
    # Name of your ClusterSecretStore for AWS.
    # ClusterSecretStore example using IRSA (IAM Roles for Service Accounts):
    #
    #   apiVersion: external-secrets.io/v1beta1
    #   kind: ClusterSecretStore
    #   metadata:
    #     name: aws-secrets-manager
    #   spec:
    #     provider:
    #       aws:
    #         service: SecretsManager
    #         region: us-east-1
    #         auth:
    #           jwt:
    #             serviceAccountRef:
    #               name: external-secrets-sa
    #               namespace: external-secrets
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: schema-registry-msk-sasl
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        sasl-jaas-config: |
          org.apache.kafka.common.security.scram.ScramLoginModule required
          username="{{ .username }}"
          password="{{ .password }}";

  data:
    - secretKey: username
      remoteRef:
        key: AmazonMSK_schema-registry
        property: username

    - secretKey: password
      remoteRef:
        key: AmazonMSK_schema-registry
        property: password
