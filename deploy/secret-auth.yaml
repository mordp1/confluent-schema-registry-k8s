# =============================================================================
# Kubernetes Secret — Schema Registry HTTP Basic Auth credentials
#
# Mounted into the Schema Registry pod at /etc/schema-registry/auth/
# Provides two files:
#   1. jaas.conf           — JAAS configuration for the Jetty security realm
#   2. password.properties — username:password,role entries for the LoginModule
#
# JAAS realm name ("SchemaRegistry-Props") MUST match:
#   authentication.realm in values.yaml (exact case match).
#
# Password file format (Jetty PropertyFileLoginModule):
#   <username>: <plaintext-password>,<role1>[,<role2>...]
#
# Roles MUST be a subset of authentication.roles in values.yaml.
#
# Security notes:
#   - Passwords are stored as PLAINTEXT. The file is 0400 (owner-read-only)
#     enforced by defaultMode: 0400 in values.yaml.
#   - NEVER commit real passwords to git.
#   - For production, use External Secrets Operator, Vault, or AWS Secrets Manager.
#   - Generate strong passwords: openssl rand -base64 32
#
# CP version note (JAAS class changed in CP 8.x):
#   CP ≤ 7.x (Jetty 9):  org.eclipse.jetty.jaas.spi.PropertyFileLoginModule
#   CP ≥ 8.x (Jetty 12): org.eclipse.jetty.security.jaas.spi.PropertyFileLoginModule
#   Using the old class with CP 8.x causes silent 401 on all authenticated requests.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: schema-registry-auth
  namespace: schema-registry   # change to match your deployment namespace
  labels:
    app.kubernetes.io/name: cp-schema-registry
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  jaas.conf: |
    SchemaRegistry-Props {
      org.eclipse.jetty.security.jaas.spi.PropertyFileLoginModule required
      file="/etc/schema-registry/auth/password.properties";
    };

  password.properties: |
    # CHANGE THESE before deploying to any shared or production environment.
    # Format: username: password,role1[,role2...]
    #
    # admin — full access (write + read + admin roles)
    admin:changeme-admin-password,admin,write,read
    # readonly — read-only service account for consumers and CI schema validation
    readonly:changeme-readonly-password,read
