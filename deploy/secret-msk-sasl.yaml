# =============================================================================
# Kubernetes Secret — MSK SASL/SCRAM-SHA-512 credentials
#
# Consumed by values-msk-sasl.yaml via:
#   customEnv:
#     - name: SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG
#       valueFrom:
#         secretKeyRef:
#           name: schema-registry-msk-sasl
#           key: sasl-jaas-config
#
# WHY a Secret and not configurationOverrides?
#   The JAAS config string contains double-quotes. Helm's {{ $value | quote }}
#   would escape them and break the JAAS parser. Using valueFrom: secretKeyRef
#   delivers the raw string directly as an env var, bypassing Helm templating.
#
# MSK SCRAM credential setup (one-time, done outside Kubernetes):
#   1. Create the user secret in AWS Secrets Manager:
#        aws secretsmanager create-secret \
#          --name AmazonMSK_schema-registry \
#          --secret-string '{"username":"schema-registry","password":"<strong-password>"}'
#      Note: the name MUST start with "AmazonMSK_"
#
#   2. Associate the secret with your MSK cluster:
#        aws kafka batch-associate-scram-secret \
#          --cluster-arn arn:aws:kafka:REGION:ACCOUNT:cluster/CLUSTER-NAME/... \
#          --secret-arn-list arn:aws:secretsmanager:REGION:ACCOUNT:secret:AmazonMSK_schema-registry-...
#
#   3. MSK creates the SCRAM user automatically. Allow ~5 minutes.
#
# PRODUCTION: Do NOT commit this file with real credentials.
# Use deploy/externalsecret-msk-sasl.yaml (External Secrets Operator) to sync
# credentials automatically from AWS Secrets Manager.
#
# Generate a strong password: openssl rand -base64 32
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: schema-registry-msk-sasl
  namespace: schema-registry   # change to match your deployment namespace
  labels:
    app.kubernetes.io/name: cp-schema-registry
    app.kubernetes.io/component: msk-auth
type: Opaque
stringData:
  sasl-jaas-config: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="your-msk-scram-user"
    password="your-msk-scram-password";
